version: '3.8'

services:
  nginx:
    image: nginx:alpine
    container_name: vue3-study-nginx
    ports:
      - "18089:80"
    volumes:
      - ./dist:/usr/share/nginx/html
      - ./nginx.conf:/etc/nginx/nginx.conf
    restart: unless-stopped
    networks:
      - vue3-study-network

networks:
  vue3-study-network:
    driver: bridge